<!DOCTYPE html>
<!-- @dsCard group="Components" name="TextAction" subtitle="DS-009 · quieter than any button · label + chevron, no frame" viewport="700x200" --><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>html,body{margin:0;padding:0;background:var(--bg);overflow:hidden}a{color:var(--interaction-300)}a:hover{color:var(--interaction-100)}
.card{box-sizing:border-box;height:200px;padding:18px 22px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.pad{padding:12px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;justify-content:space-between;align-items:center;min-height:var(--control-height);margin:-8px 0}
.lb{font-family:var(--font-data);font-size:12px;font-weight:700;letter-spacing:var(--tracking-data);text-transform:uppercase;color:var(--text-card-label)}
.b{font-size:var(--paragraph-sm-size);line-height:var(--paragraph-sm-line-height);color:var(--text-secondary)}
.btn{width:100%;min-height:var(--control-height)}.col{display:grid;gap:4px}</style></head>
<body><div class="card">
<div class="clr-bleed clr-bleed--block"><div class="clr-card"><span class="clr-card__bar"></span><div class="clr-chamfer clr-chamfer--md clr-card__body pad"><div class="row"><span class="lb">Favorites</span><button type="button" class="clr-text-action">View all</button></div><span class="b">Lower · Posterior</span></div></div></div>
<div class="col"><span class="clr-bleed clr-glow" style="display:flex"><button class="clr-chamfer clr-chamfer--sm clr-btn clr-btn--primary btn" type="button">Generate workout</button></span><button type="button" class="clr-text-action clr-text-action--block">Skip for now</button></div>
</div></body></html>
