<!DOCTYPE html>
<html data-skin="clear"><head><meta charset="utf-8"><title>Layouts: round 2</title>
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0;background:var(--bg);color:var(--text-paragraph);font-family:var(--font-body)}
a{color:var(--interaction-400)}a:hover{color:var(--interaction-300)}
.pg{padding:24px;display:flex;flex-direction:column;gap:36px;max-width:1280px}
.ttl{font-family:var(--font-display);font-size:20px;font-weight:700;text-transform:uppercase;color:var(--text-header)}
.sub{font-size:13px;line-height:1.5;max-width:880px;color:var(--text-secondary)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:5;padding:10px 0;background:var(--bg)}
.bar .l{font-family:var(--font-data);font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-card-label)}
.bar .clr-chip{min-height:32px;padding:4px 10px;font-size:var(--label-xs-size)}
section{display:flex;flex-direction:column;gap:12px}
h2{margin:0;font-family:var(--font-display);font-size:16px;font-weight:700;text-transform:uppercase;color:var(--text-header)}
.grid{display:flex;gap:18px;flex-wrap:wrap}
.opt{display:flex;flex-direction:column;gap:10px;width:360px;max-width:100%}
.badge{display:flex;gap:8px;align-items:baseline}
.badge b{font-family:var(--font-data);font-size:11px;font-weight:700;letter-spacing:.05em;padding:2px 6px;border:var(--border-width) solid var(--structure-500);color:var(--text-header)}
.badge span{font-family:var(--font-data);font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-header)}
.desc{font-size:12px;line-height:1.5;color:var(--text-secondary)}
.flag{font-family:var(--font-data);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--selection-400)}
.scr{content-visibility:auto;contain-intrinsic-size:360px 680px;contain:layout paint;position:relative;overflow:hidden;width:360px;max-width:100%;height:680px;border:var(--border-width) solid var(--border-frame-structure);display:flex;flex-direction:column}
.scr>.clr-atmosphere{z-index:0}.body{position:relative;z-index:1;flex:1;min-height:0;display:flex;flex-direction:column;gap:16px;padding:16px;overflow:hidden}
.foot{position:relative;z-index:1;padding:12px 16px;border-top:var(--border-width) solid var(--border-region-rule);display:grid;gap:8px}
.h1{font-family:var(--font-display);font-size:24px;font-weight:700;line-height:1.1;text-transform:uppercase;color:var(--text-header)}
.hrow{display:flex;align-items:center;gap:12px;min-height:var(--control-height)}.hrow .h1{flex:1 1 auto;min-width:0}
.lb{font-family:var(--font-data);font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-card-label)}
.t20{font-family:var(--font-display);font-size:20px;font-weight:700;line-height:1.1;text-transform:uppercase;color:var(--text-header)}
.b14{font-size:14px;line-height:1.25;color:var(--text-secondary)}
.p14{font-size:14px;line-height:1.25;color:var(--text-paragraph)}
.frame{padding:12px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;line-height:1.25;color:var(--text-paragraph)}
.row span{font-family:var(--font-data);font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-secondary)}
.ruled+.ruled{border-top:1px solid var(--structure-a300);padding-top:8px}
.btn{min-height:var(--control-height);padding:0 16px;width:100%}
.bl{display:flex;flex-direction:column}
.fld{display:flex;flex-direction:column;gap:6px}
.band{margin:0 -16px;padding:0 16px;box-shadow:inset 0 2px 0 var(--border-tab-rail),inset 0 -2px 0 var(--border-tab-rail);display:flex;gap:20px}
.tab{font-family:var(--font-data);font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:12px 0;color:var(--text-tab-inactive)}
.tab.on{color:var(--text-tab-active);box-shadow:inset 0 -2px 0 var(--border-tab-active)}
.timer{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px}
.digits{font-family:var(--font-data);font-size:56px;font-weight:700;letter-spacing:.06em;color:var(--text-timer);line-height:1}
.seg{display:flex;gap:3px}.seg i{flex:1;height:10px;background:var(--selection-a150)}.seg i.on{background:var(--selection-500)}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--font-data);font-size:24px;font-weight:700;color:var(--text-header);letter-spacing:.03em}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hdiv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.hdiv>div{padding:0 10px}.hdiv>div+div{border-left:1px solid var(--structure-a300)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.clr-card__body{display:flex;flex-direction:column;gap:4px}
</style></head><body><div class="pg">
<div class="ttl">Layouts: round 2</div>
<div class="sub">More complex screens, at phone size, built only from decided parts. Each section changes one thing about the screen. Pick a letter, or say what it depends on.</div>
<div class="bar"><span class="l">Skin</span><span id="skins" style="display:flex;gap:6px"></span></div>
<div id="secs"></div>
</div>
<script>
const host=document.getElementById('skins');
['clear','vapour','signal','mono'].forEach((s,i)=>{const b=document.createElement('button');b.type='button';b.textContent=s;b.className='clr-chamfer clr-chamfer--sm clr-chip';b.setAttribute('aria-pressed',i===0);
 b.onclick=()=>{[...host.children].forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');document.documentElement.setAttribute('data-skin',s)};host.appendChild(b)});
const ATM='<div class="clr-atmosphere"><span class="clr-atmosphere__blob clr-atmosphere__blob--structure"></span><span class="clr-atmosphere__blob clr-atmosphere__blob--interaction"></span><span class="clr-atmosphere__blob clr-atmosphere__blob--info"></span><span class="clr-atmosphere__blob clr-atmosphere__blob--selection"></span><span class="clr-atmosphere__overlay"></span><span class="clr-atmosphere__scan"></span></div>';
const F=(inner,sz='md',cls='',attr='')=>`<div class="clr-bleed clr-bleed--block"><div class="clr-chamfer clr-chamfer--${sz} frame ${cls}" ${attr}>${inner}</div></div>`;
const P=t=>`<span class="clr-bleed clr-glow bl"><button class="clr-chamfer clr-chamfer--sm clr-btn clr-btn--primary btn" type="button">${t}</button></span>`;
const S=t=>`<span class="clr-bleed bl"><button class="clr-chamfer clr-chamfer--sm clr-btn btn" type="button">${t}</button></span>`;
const IB=`<span class="clr-bleed"><button class="clr-chamfer clr-chamfer--sm clr-btn" type="button" aria-label="Back" style="width:40px;height:40px;padding:0;display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M16 3h-4L4 12l8 9h4l-8-9z"/></svg></button></span>`;
const rows=r=>r.map(([a,b])=>`<div class="row">${a}<span>${b}</span></div>`).join('');
const scr=(body,foot)=>`<div class="scr" data-atmosphere="full">${ATM}<div class="body">${body}</div>${foot?`<div class="foot">${foot}</div>`:''}</div>`;
const SEG=(n,on)=>`<div class="seg">${Array.from({length:n},(_,i)=>`<i class="${i<on?'on':''}"></i>`).join('')}</div>`;
const timer=(big)=>F(`<span class="lb">Rest</span><span class="digits"${big?'':' style="font-size:40px"'}>01:15</span>`,'lg','timer');
const set=`<div class="row">Set 3 of 5<span>90kg × 5</span></div>${SEG(20,8)}`;
const chips=`<div class="chips"><span class="clr-bleed"><button class="clr-chamfer clr-chamfer--sm clr-chip" type="button" aria-pressed="false">Easy</button></span><span class="clr-bleed"><button class="clr-chamfer clr-chamfer--sm clr-chip" type="button" aria-pressed="true"><svg viewBox="0 0 24 24" width="10" height="10" fill="currentColor"><path d="M9.6 20.4 2.4 13.2l3.4-3.4 3.8 3.8L18.2 3l3.4 3.4z"/></svg>Hard</button></span><span class="clr-bleed"><button class="clr-chamfer clr-chamfer--sm clr-chip" type="button" aria-pressed="false">Max</button></span></div>`;
const statsBox=(k)=>k==='cards'?`<div class="stats">${[['Sessions','12'],['Volume','8.4t'],['Streak','5']].map(([l,v])=>F(`<span class="lb">${l}</span><span class="stat"><b>${v}</b></span>`,'sm')).join('')}</div>`
 :k==='one'?F(`<div class="hdiv">${[['Sessions','12'],['Volume','8.4t'],['Streak','5']].map(([l,v])=>`<div class="stat"><span class="lb">${l}</span><b>${v}</b></div>`).join('')}</div>`)
 :F(rows([['Sessions','12'],['Volume','8.4t'],['Streak','5 days']]));
const SECTIONS=[
 {t:'1 · An active session',s:'The busiest screen: a set in progress with a rest timer, effort logging and progress. What leads the screen?',o:[
  ['A','Timer leads','The rest timer is the biggest thing on screen; the set and effort sit below it.',scr(`<div class="hrow">${IB}<div class="h1">Lower push</div></div>${timer(1)}<div class="fld"><span class="lb">Back squat</span>${F(set)}</div><div class="fld"><span class="lb">How did that feel?</span>${chips}</div>`,P('Log set')),'Recommended: the timer is what you look at between sets'],
  ['B','Set leads','The current set is first and largest; the timer is a smaller readout under it.',scr(`<div class="hrow">${IB}<div class="h1">Lower push</div></div><div class="fld"><span class="lb">Back squat</span>${F(`<div class="t20">Set 3 of 5</div><div class="row">Target<span>90kg × 5</span></div>${SEG(20,8)}`)}</div>${timer(0)}<div class="fld"><span class="lb">How did that feel?</span>${chips}</div>`,P('Log set'))],
  ['C','Split view','The timer and the set share one frame, side by side, so both are visible at a glance.',scr(`<div class="hrow">${IB}<div class="h1">Lower push</div></div>${F(`<div style="display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center"><div style="display:flex;flex-direction:column;gap:2px"><span class="lb">Rest</span><span class="digits" style="font-size:36px">01:15</span></div><div style="display:flex;flex-direction:column;gap:6px;border-left:1px solid var(--structure-a300);padding-left:14px"><span class="lb">Back squat</span><span class="p14">Set 3 of 5</span><span class="b14">90kg × 5</span></div></div>${SEG(20,8)}`)}<div class="fld"><span class="lb">How did that feel?</span>${chips}</div>`,P('Log set'))]]},
 {t:'2 · Stats on a summary screen',s:'A week summary with three numbers above a session list.',o:[
  ['A','Three small frames','Each number has its own small frame.',scr(`<div class="h1">This week</div>${statsBox('cards')}<div class="fld"><span class="lb">Sessions</span>${F(rows([['Upper pull','Mon'],['Conditioning','Sat'],['Lower push','Thu']]))}</div>`)],
  ['B','One frame, divided','All three in one frame, with rules between them.',scr(`<div class="h1">This week</div>${statsBox('one')}<div class="fld"><span class="lb">Sessions</span>${F(rows([['Upper pull','Mon'],['Conditioning','Sat'],['Lower push','Thu']]))}</div>`),'Recommended: one frame, sub-groups by rule (your rule)'],
  ['C','As list rows','The numbers are rows in a frame, like the list below.',scr(`<div class="h1">This week</div>${statsBox('rows')}<div class="fld"><span class="lb">Sessions</span>${F(rows([['Upper pull','Mon'],['Conditioning','Sat'],['Lower push','Thu']]))}</div>`)]]},
 {t:'3 · A detail screen with tabs',s:'An exercise\u2019s detail: what it is, past sets, and notes. Where do the tabs go?',o:[
  ['A','Tabs under the title','Tabs in a full-width band right under the title, as on the App Shell.',scr(`<div class="hrow">${IB}<div class="h1">Back squat</div></div><div class="band"><span class="tab on">History</span><span class="tab">Technique</span><span class="tab">Notes</span></div><div class="fld"><span class="lb">Last 3 sessions</span>${F(rows([['Thu','90kg × 5 × 5'],['Mon','87.5kg × 5 × 5'],['Thu','85kg × 5 × 5']]))}</div>`,P('Add to session')),'Recommended: consistent with the App Shell'],
  ['B','Summary, then tabs','A short summary first, then the tabs, so the key facts don\u2019t change between tabs.',scr(`<div class="hrow">${IB}<div class="h1">Back squat</div></div>${F(rows([['Best','95kg × 3'],['Last','90kg × 5 × 5']]))}<div class="band"><span class="tab on">History</span><span class="tab">Technique</span><span class="tab">Notes</span></div><div class="fld"><span class="lb">Last 3 sessions</span>${F(rows([['Thu','90kg × 5 × 5'],['Mon','87.5kg × 5 × 5']]))}</div>`,P('Add to session'))],
  ['C','No tabs, sections','No tabs: everything in labelled sections, one after another.',scr(`<div class="hrow">${IB}<div class="h1">Back squat</div></div><div class="fld"><span class="lb">History</span>${F(rows([['Thu','90kg × 5 × 5'],['Mon','87.5kg × 5 × 5']]))}</div><div class="fld"><span class="lb">Technique</span>${F('<span class="b14">Brace before you unrack. Keep the bar over mid-foot.</span>')}</div><div class="fld"><span class="lb">Notes</span>${F('<span class="b14">Left knee caves on the last rep.</span>')}</div>`,P('Add to session'))]]},
 {t:'4 · Two actions in the footer',s:'A finished session: save it, or discard it. Footer rule is decided; this is how two actions sit in it on a phone.',o:[
  ['A','Stacked, primary first','Full width, primary on top, as the button-row rule says for phones.',scr(`<div class="h1">Session done</div>${F(rows([['Duration','42 min'],['Sets','18 of 20'],['Volume','8.4t']]))}`,P('Save session')+S('Discard')),'Recommended: what the button-row rule already says'],
  ['B','Primary + text action','The primary button, and a quiet "Discard" under it with no frame.',scr(`<div class="h1">Session done</div>${F(rows([['Duration','42 min'],['Sets','18 of 20'],['Volume','8.4t']]))}`,P('Save session')+`<button class="clr-btn clr-btn--quiet" type="button" style="min-height:40px;background:transparent;border:0;color:var(--text-secondary)">Discard</button>`)],
  ['C','Discard moves up','Only the primary is in the footer; Discard moves into the screen as a secondary button.',scr(`<div class="h1">Session done</div>${F(rows([['Duration','42 min'],['Sets','18 of 20'],['Volume','8.4t']]))}<div style="margin-top:auto">${S('Discard session')}</div>`,P('Save session'))]]}
];
const secHTML=x=>`<section><h2>${x.t}</h2><div class="sub">${x.s}</div><div class="grid">${x.o.map(([o,l,d,body,flag])=>`<div class="opt"><div class="badge"><b>${o}</b><span>${l}</span></div>${body}<div class="desc">${d}</div>${flag?`<div class="flag">${flag}</div>`:''}</div>`).join('')}</div></section>`;
const box=document.getElementById('secs');let k=0;const step=()=>{if(k>=SECTIONS.length)return;box.insertAdjacentHTML('beforeend',secHTML(SECTIONS[k++]));requestAnimationFrame(step)};requestAnimationFrame(step);
</script>
</body></html>
