<!DOCTYPE html>
<html data-skin="clear"><head><meta charset="utf-8"><title>Before and after: EmptyState and templates</title>
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0;background:var(--bg);color:var(--text-paragraph);font-family:var(--font-body)}
a{color:var(--interaction-400)}a:hover{color:var(--interaction-300)}
.pg{padding:24px;display:flex;flex-direction:column;gap:32px;max-width:1280px}
.ttl{font-family:var(--font-display);font-size:20px;font-weight:700;text-transform:uppercase;color:var(--text-header)}
.sub{font-size:13px;line-height:1.5;max-width:880px;color:var(--text-secondary)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bar .l{font-family:var(--font-data);font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-card-label)}
.bar .clr-chip{min-height:32px;padding:4px 10px;font-size:var(--label-xs-size)}
section{display:flex;flex-direction:column;gap:12px}
h2{margin:0;font-family:var(--font-display);font-size:16px;font-weight:700;text-transform:uppercase;color:var(--text-header)}
.pair{display:flex;gap:18px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px;width:360px;max-width:100%}
.tag{font-family:var(--font-data);font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-header);display:flex;gap:8px;align-items:center}
.tag i{font-style:normal;padding:2px 6px;border:var(--border-width) solid var(--structure-500)}
.tag.new i{border-color:var(--selection-500);color:var(--selection-400)}
.desc{font-size:12px;line-height:1.5;color:var(--text-secondary)}
iframe{width:360px;max-width:100%;height:640px;border:var(--border-width) solid var(--border-frame-structure);background:var(--base)}
.scr{position:relative;overflow:hidden;width:360px;max-width:100%;height:640px;border:var(--border-width) solid var(--border-frame-structure);display:flex;flex-direction:column}
.scr>.clr-atmosphere{z-index:0}.body{position:relative;z-index:1;flex:1;min-height:0;display:flex;flex-direction:column;gap:16px;padding:16px;overflow:hidden}
.foot{position:relative;z-index:1;padding:12px 16px;border-top:var(--border-width) solid var(--border-region-rule);display:grid;gap:8px}
.h1{font-family:var(--font-display);font-size:24px;font-weight:700;line-height:1.1;text-transform:uppercase;color:var(--text-header)}
.hrow{display:flex;align-items:center;gap:12px;min-height:var(--control-height)}.hrow .h1{flex:1 1 auto;min-width:0}
.lb{font-family:var(--font-data);font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-card-label)}
.t20{font-family:var(--font-display);font-size:20px;font-weight:700;line-height:1.1;text-transform:uppercase;color:var(--text-header);text-align:center}
.b14{font-size:14px;line-height:1.25;color:var(--text-secondary)}
.p14{font-size:14px;line-height:1.25;color:var(--text-paragraph)}
.frame{padding:12px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;line-height:1.25;color:var(--text-paragraph)}
.row span{font-family:var(--font-data);font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-secondary)}
.btn{min-height:var(--control-height);padding:0 16px;width:100%}
.bl{display:flex;flex-direction:column}
.fld{display:flex;flex-direction:column;gap:4px}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.old .frame{align-items:center;text-align:center;padding:20px}
.cur::after{content:"_";margin-left:2px;color:var(--text-header);animation:cb 1s steps(1) infinite}@keyframes cb{50%{opacity:0}}
.tabs{display:flex;gap:20px;box-shadow:inset 0 -2px 0 var(--border-tab-rail)}
.tab{font-family:var(--font-data);font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:10px 0;color:var(--text-tab-inactive)}
.tab.on{color:var(--text-tab-active);box-shadow:inset 0 -2px 0 var(--border-tab-active)}
.band{margin:0 -16px;padding:0 16px;box-shadow:inset 0 2px 0 var(--border-tab-rail),inset 0 -2px 0 var(--border-tab-rail)}.band .tabs{box-shadow:none}
</style></head><body><div class="pg">
<div class="ttl">Before and after</div>
<div class="sub">Nothing here is committed. The left of each pair is what ships now; for the templates, it's the real template file running. The right is the same screen with only what the rules require changed. Each lists what's kept and what changes.</div>
<div class="bar"><span class="l">Skin</span><span id="skins" style="display:flex;gap:6px"></span></div>
<div id="secs"></div>
</div>
<script>
const host=document.getElementById('skins');
['clear','vapour','signal','mono'].forEach((s,i)=>{const b=document.createElement('button');b.type='button';b.textContent=s;b.className='clr-chamfer clr-chamfer--sm clr-chip';b.setAttribute('aria-pressed',i===0);
 b.onclick=()=>{[...host.children].forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');document.documentElement.setAttribute('data-skin',s);document.querySelectorAll('iframe').forEach(f=>{try{f.contentDocument.documentElement.setAttribute('data-skin',s)}catch(e){}})};host.appendChild(b)});
const ATM='<div class="clr-atmosphere"><span class="clr-atmosphere__blob clr-atmosphere__blob--structure"></span><span class="clr-atmosphere__blob clr-atmosphere__blob--interaction"></span><span class="clr-atmosphere__blob clr-atmosphere__blob--info"></span><span class="clr-atmosphere__blob clr-atmosphere__blob--selection"></span><span class="clr-atmosphere__overlay"></span><span class="clr-atmosphere__scan"></span></div>';
const F=(inner,sz='md',cls='')=>`<div class="clr-bleed clr-bleed--block"><div class="clr-chamfer clr-chamfer--${sz} frame ${cls}">${inner}</div></div>`;
const P=t=>`<span class="clr-bleed clr-glow bl"><button class="clr-chamfer clr-chamfer--sm clr-btn clr-btn--primary btn" type="button">${t}</button></span>`;
const IB=`<span class="clr-bleed"><button class="clr-chamfer clr-chamfer--sm clr-btn" type="button" aria-label="Back" style="width:40px;height:40px;padding:0;display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M16 3h-4L4 12l8 9h4l-8-9z"/></svg></button></span>`;
const rows=r=>r.map(([a,b])=>`<div class="row">${a}<span>${b}</span></div>`).join('');
const scr=(body,foot)=>`<div class="scr" data-atmosphere="full">${ATM}<div class="body">${body}</div>${foot?`<div class="foot">${foot}</div>`:''}</div>`;
const fld=(l,v,u,ph)=>`<div class="fld"><span class="lb">${l}</span><div class="clr-field"><input class="clr-input" ${v?`value="${v}"`:''} ${ph?`placeholder="${ph}"`:''} aria-label="${l}">${u?`<span class="clr-field__unit">${u}</span>`:''}</div></div>`;
const PAIRS=[
 {t:'EmptyState component',s:'The component today draws a centred frame with its own button. After: it sits inside the list frame as a plain message, and the action moves to the screen\u2019s footer.',
  before:scr(`<div class="h1">History</div><div class="center" style="width:100%"><div id="real-empty" style="width:100%"><span class="b14">Loading the real component…</span></div></div>`),bd:'The real <code>EmptyState</code> component, as it ships.',
  after:scr(`<div class="h1">History</div><div class="fld"><span class="lb">Sessions</span>${F(`<div class="p14">No sessions logged.</div><div class="b14">Start one and it will appear here.</div>`)}</div>`,P('Start a session')),ad:'The list frame stays; the message sits in it. The action is in the pinned footer, like every screen.'},

 {t:'App Shell template',s:'Same screen, same content. Only what the rules require changes.',before:'<iframe src="../templates/app-shell/AppShell.dc.html" title="App Shell template, current" loading="lazy"></iframe>',bd:'The current template, running.',
  after:scr(`<div class="hrow"><span id="logo-shell" style="flex:1;display:flex"></span><span class="lb">Week 04 · Day 2</span></div><div class="band"><div class="tabs"><span class="tab on">Today</span><span class="tab">History</span><span class="tab">Profile</span></div></div><div class="h1">Today</div>${F('<span class="lb">Session 09 · 42 min · Int. 7</span><div class="t20" style="text-align:left">Lower Push</div><div class="b14">Squat focus. Barbell, bands. Left shoulder respected.</div>')}${F('<span class="lb">Optional · 12 min</span><div class="t20" style="text-align:left">Mobility Block</div><div class="b14">Hips and ankles. Low intensity.</div>')}`,P('Initiate workout')),ad:'<b>Kept:</b> logo and date top right, the three tabs including Profile, title, both cards and their text.<br><b>Changed:</b> the accent column is gone, so each card is one closed frame with its title inside; the button moves to a pinned footer; the tabs sit in a full-width band with a line above and below, matching the footer's full-width line.'},
 {t:'Form Screen template',s:'Same screen, same fields.',before:'<iframe src="../templates/form-screen/FormScreen.dc.html" title="Form Screen template, current" loading="lazy"></iframe>',bd:'The current template, running.',
  after:scr(`<div class="h1">Generate workout</div><div class="fld"><span class="lb">Goal</span><div style="display:flex;gap:8px;flex-wrap:wrap"><span class="clr-bleed"><button class="clr-chamfer clr-chamfer--sm clr-chip" type="button" aria-pressed="true"><svg viewBox="0 0 24 24" width="10" height="10" fill="currentColor"><path d="M9.6 20.4 2.4 13.2l3.4-3.4 3.8 3.8L18.2 3l3.4 3.4z"/></svg>Strength</button></span><span class="clr-bleed"><button class="clr-chamfer clr-chamfer--sm clr-chip" type="button" aria-pressed="false">Cardio</button></span><span class="clr-bleed"><button class="clr-chamfer clr-chamfer--sm clr-chip" type="button" aria-pressed="false">Mobility</button></span><span class="clr-bleed"><button class="clr-chamfer clr-chamfer--sm clr-chip" type="button" aria-pressed="false">Mixed</button></span></div></div><div class="fld"><span class="lb">Int. 7</span><input class="clr-slider" type="range" min="1" max="10" value="7" aria-label="Intensity"></div>${fld('Time available','','','45 minutes, hard stop at 6.')}<div class="fld"><span class="lb">Limitations</span><div class="clr-field"><textarea class="clr-input" rows="3" aria-label="Limitations" placeholder="Bad left shoulder from years ago."></textarea></div></div><label class="clr-check"><input type="checkbox"><span class="clr-check__box"></span><span class="clr-check__label">Mark rest day</span></label>`,P('Generate')),ad:'<b>Kept:</b> title, goal chips, intensity slider, both fields, rest-day checkbox.<br><b>Changed:</b> Generate moves to a pinned footer. Everything else already follows the rules (fields on the atmosphere, labels above), and picks up the new defaults (square slider, block checkbox) automatically.'},
 {t:'Boot Sequence template',s:'Same screen. The template cycles through states; this shows the checking state.',before:'<iframe src="../templates/boot-sequence/BootSequence.dc.html" title="Boot Sequence template, current" loading="lazy"></iframe>',bd:'The current template, running. It cycles through its states, so it may not be on the same one.',
  after:scr(`<div class="center" style="width:100%;justify-content:flex-start;padding-top:40px;gap:24px"><span id="logo-boot"></span><div style="width:100%"><div class="clr-bleed clr-bleed--block"><div class="clr-chamfer clr-chamfer--md frame" aria-busy="true" style="text-align:left"><span class="lb">System check</span><span class="p14">Profile · loaded</span><span class="p14">Equipment · barbell</span><span class="p14 cur">Reading history</span></div></div></div></div>`),ad:'<b>Kept:</b> logo boot, the system-check loader and its lines, the failed and ready states.<br><b>Changed:</b> the loader stops pulsing and ends its current line in the cursor; when ready, "Begin session" sits in a pinned footer instead of mid-screen.'}
];
document.getElementById('secs').innerHTML=PAIRS.map(p=>`<section><h2>${p.t}</h2><div class="sub">${p.s}</div><div class="pair"><div class="col"><div class="tag"><i>Now</i></div>${p.before}<div class="desc">${p.bd}</div></div><div class="col"><div class="tag new"><i>Proposed</i></div>${p.after}<div class="desc">${p.ad}</div></div></div></section>`).join('');
</script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
<script>
(function(){const NS=window.CLEARDesignSystem_4ee044||{};const el=document.getElementById('real-empty');
 if(!el||!NS.EmptyState){if(el)el.innerHTML='<span class="b14">Bundle not loaded. Reload the page.</span>';return}
 const L=(id,p)=>{const n=document.getElementById(id);if(n&&NS.ClearLogo)ReactDOM.createRoot(n).render(React.createElement(NS.ClearLogo,p))};L('logo-shell',{size:'md'});L('logo-boot',{size:'lg',boot:true});
 ReactDOM.createRoot(el).render(React.createElement(NS.EmptyState,{title:'No sessions logged',message:'Generate a workout and it will appear here.',actionLabel:'Generate'}));})();
</script>
</body></html>
