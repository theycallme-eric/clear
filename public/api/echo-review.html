<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CLEAR · Echo controls</title>
<style>
:root { color-scheme: dark; font-family: system-ui, sans-serif; color: #f4eaf2; background: #100d14; }
* { box-sizing: border-box; }
body { margin: 0; }
iframe { display: block; width: 100%; height: 100dvh; border: 0; }
#panel { position: fixed; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); width: min(300px, calc(100vw - 24px)); padding: 18px; border: 1px solid #65536b; border-radius: 8px; background: #1b161ff5; box-shadow: 0 8px 30px #0008; }
header, .label, .buttons { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { font-size: 17px; margin: 0; }
label { display: block; font-size: 14px; margin: 18px 0; }
.label { margin-bottom: 8px; }
output { color: #f1bfdf; font-variant-numeric: tabular-nums; }
input { accent-color: #e492c5; }
input[type=range] { width: 100%; }
button { font: inherit; font-size: 13px; color: inherit; background: #302535; border: 1px solid #75617c; border-radius: 4px; padding: 9px 12px; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid #f1bfdf; outline-offset: 3px; }
p { margin: 12px 0 0; font-size: 12px; line-height: 1.4; color: #c9b8cd; }
#show { position: fixed; bottom: max(12px, env(safe-area-inset-bottom)); right: 12px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<iframe id="app" title="CLEAR live preview" src="/generate"></iframe>
<button id="show" hidden>Echo controls</button>
<section id="panel" aria-label="Echo controls">
 <header><h1>Phosphor Echo</h1><button id="hide">Hide</button></header>
 <label><input id="enabled" type="checkbox" checked> Echo on</label>
 <label><span class="label">Strength <output id="strength-value" for="strength">—</output></span><input id="strength" aria-label="Echo strength" type="range" min="0" max="1" step="0.01"></label>
 <label><span class="label">Softness <output id="softness-value" for="softness">—</output></span><input id="softness" aria-label="Echo softness" type="range" min="0" max="8" step="0.1"></label>
 <label><span class="label">Offset <output id="offset-value" for="offset">—</output></span><input id="offset" aria-label="Echo offset" type="range" min="0" max="12" step="0.1"></label>
 <div class="buttons"><button id="reset">Reset</button><button id="copy">Copy settings</button></div>
 <p id="status" role="status">Loading…</p>
</section>
<script type="module">
const byId = id => document.getElementById(id);
const frame = byId('app');
const fields = {opacity: byId('strength'), blur: byId('softness'), x: byId('offset')};
const params = new URLSearchParams(location.hash.slice(1));
let baseline, draft, filter, observer;
let enabled = params.get('echo') !== '0';
const round = value => Number(value.toFixed(2));
const requested = {opacity: Number(params.get('opacity')), blur: Number(params.get('blur')), x: Number(params.get('x')), y: Number(params.get('y'))};
if (['opacity','blur','x','y'].every(key => params.has(key) && Number.isFinite(requested[key])) && requested.opacity >= 0 && requested.opacity <= 1 && requested.blur >= 0 && requested.blur <= 8 && requested.x >= -12 && requested.x <= 0 && requested.y >= 0 && requested.y <= 14.4) draft = requested;

function apply() {
 if (!filter || !draft) return;
 filter.querySelector('feGaussianBlur').setAttribute('stdDeviation', draft.blur);
 filter.querySelector('feOffset').setAttribute('dx', draft.x);
 filter.querySelector('feOffset').setAttribute('dy', draft.y);
 filter.querySelector('feFuncA').setAttribute('slope', enabled ? draft.opacity : 0);
 fields.opacity.value = draft.opacity; fields.blur.value = draft.blur; fields.x.value = Math.abs(draft.x);
 byId('enabled').checked = enabled;
 byId('strength-value').textContent = `${Math.round(draft.opacity * 100)}%`;
 byId('softness-value').textContent = `${round(draft.blur)} px`;
 byId('offset-value').textContent = `${round(-draft.x)} left / ${round(draft.y)} down`;
 history.replaceState(null, '', '#' + new URLSearchParams({...draft, echo: enabled ? '1' : '0'}));
 byId('status').textContent = 'Echo only. Scanlines stay unchanged.';
}
function connect() {
 const next = frame.contentDocument?.getElementById('clr-phosphor-echo');
 if (!next || next === filter) return;
 filter = next;
 const current = {opacity: Number(filter.querySelector('feFuncA').getAttribute('slope')), blur: Number(filter.querySelector('feGaussianBlur').getAttribute('stdDeviation')), x: Number(filter.querySelector('feOffset').getAttribute('dx')), y: Number(filter.querySelector('feOffset').getAttribute('dy'))};
 baseline ??= current; draft ??= {...current}; apply();
}
frame.addEventListener('load', () => {
 observer?.disconnect(); filter = null;
 try { observer = new MutationObserver(connect); observer.observe(frame.contentDocument, {childList: true, subtree: true}); connect(); }
 catch { byId('status').textContent = 'Open the app below, then reload these controls.'; }
});
for (const [key, input] of Object.entries(fields)) input.addEventListener('input', () => {
 if (!draft) return;
 const value = Number(input.value);
 draft = key === 'x' ? {...draft, x: -value, y: round(value * 1.2)} : {...draft, [key]: value}; apply();
});
byId('enabled').addEventListener('change', event => {enabled = event.target.checked; apply();});
byId('reset').addEventListener('click', () => {if (baseline) {draft = {...baseline}; enabled = true; apply();}});
byId('hide').addEventListener('click', () => {byId('panel').hidden = true; byId('show').hidden = false; byId('show').focus();});
byId('show').addEventListener('click', () => {byId('panel').hidden = false; byId('show').hidden = true; byId('hide').focus();});
byId('copy').addEventListener('click', async () => {
 if (!draft) return;
 const text = JSON.stringify({effect: 'Phosphor Echo', enabled, ...draft, scanlines: 'unchanged'}, null, 2) + '\n\n' + location.href;
 try {await navigator.clipboard.writeText(text); byId('status').textContent = 'Copied. Paste the settings into our chat.';}
 catch {byId('status').textContent = 'Copy this page’s link, or send a screenshot of these values.';}
});
if (frame.contentDocument?.readyState === 'complete') frame.dispatchEvent(new Event('load'));
</script>
</body>
</html>
