<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CLEAR · Scanline controls</title>
<style>
:root { color-scheme: dark; font-family: system-ui, sans-serif; color: #f4eaf2; background: #100d14; }
* { box-sizing: border-box; }
body { margin: 0; }
iframe { display: block; width: 100%; height: 100dvh; border: 0; }
#panel { position: fixed; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); width: min(300px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); overflow-y: auto; padding: 18px; border: 1px solid #65536b; border-radius: 8px; background: #1b161ff5; box-shadow: 0 8px 30px #0008; }
header, .label, .buttons { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { font-size: 17px; margin: 0; }
label { display: block; font-size: 14px; margin: 16px 0; }
.label { margin-bottom: 6px; }
output, a { color: #f1bfdf; font-variant-numeric: tabular-nums; }
input { accent-color: #e492c5; }
input[type=range] { width: 100%; }
button { font: inherit; font-size: 13px; color: inherit; background: #302535; border: 1px solid #75617c; border-radius: 4px; padding: 9px 12px; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid #f1bfdf; outline-offset: 3px; }
p { margin: 12px 0 0; font-size: 12px; line-height: 1.4; color: #c9b8cd; }
#show { position: fixed; bottom: max(12px, env(safe-area-inset-bottom)); right: 12px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<iframe id="app" title="CLEAR live scanline preview" src="/generate"></iframe>
<button id="show" hidden>Scanline controls</button>
<section id="panel" aria-label="Scanline controls">
 <header><h1>Scanlines</h1><button id="hide">Hide</button></header>
 <label><input id="enabled" type="checkbox" checked> Scanlines on</label>
 <label><span class="label">Strength <output id="opacity-value" for="opacity">—</output></span><input id="opacity" aria-label="Scanline strength" type="range" min="0" max="0.5" step="0.01"></label>
 <label><span class="label">Spacing <output id="periodPx-value" for="periodPx">—</output></span><input id="periodPx" aria-label="Scanline spacing" type="range" min="1" max="12" step="0.1"></label>
 <label><span class="label">Thickness <output id="thicknessPx-value" for="thicknessPx">—</output></span><input id="thicknessPx" aria-label="Scanline thickness" type="range" min="0.1" max="4" step="0.1"></label>
 <label><span class="label">Curvature <output id="curvaturePx-value" for="curvaturePx">—</output></span><input id="curvaturePx" aria-label="Scanline curvature" type="range" min="0" max="24" step="0.1"></label>
 <label><input id="motion" type="checkbox" checked> Let the lines drift</label>
 <label><span class="label">Drift cycle <output id="driftSecondsPerPeriod-value" for="driftSecondsPerPeriod">—</output></span><input id="driftSecondsPerPeriod" aria-label="Scanline drift cycle" type="range" min="0.1" max="10" step="0.1"></label>
 <div class="buttons"><button id="reset">Reset</button><button id="copy">Copy settings</button></div>
 <p id="status" role="status">Loading…</p>
 <p><a href="/api/echo-compare.html">Echo comparison</a> · <a id="echo-link" href="/api/echo-review.html">Echo controls</a></p>
</section>
<script type="module">
const byId = id => document.getElementById(id);
const frame = byId('app');
const keys = ['opacity', 'periodPx', 'thicknessPx', 'curvaturePx', 'driftSecondsPerPeriod'];
const params = new URLSearchParams(location.hash.slice(1));
const echo = {opacity: 0.21, blur: 1.8, x: -7.12, y: 6.75};
byId('echo-link').hash = new URLSearchParams({...echo, echo: '1'});
let baseline, draft, field, lines, path, clock, observer, resizeObserver;
let enabled = params.get('lines') !== '0', motion = params.get('motion') !== '0';

// Same geometry as src/ui/crt-field/config.ts::crtFieldLinePath, applied only
// to the existing live field in this review iframe. No second scanline layer.
function linePath(width, height) {
 const {periodPx, curvaturePx} = draft;
 const round = value => Math.round(value * 100) / 100;
 const segments = [];
 for (let y = -periodPx; y <= height + periodPx; y += periodPx) {
  const bow = curvaturePx * Math.max(-1, Math.min(1, 1 - (2 * y) / height));
  segments.push(`M0 ${round(y + bow / 2)}Q${round(width / 2)} ${round(y - bow * 3 / 2)} ${round(width)} ${round(y + bow / 2)}`);
 }
 return segments.join('');
}
function geometry() {
 if (!draft || !field) return;
 const {width, height} = field.getBoundingClientRect();
 const extraHeight = height + draft.periodPx * 2;
 lines.setAttribute('width', width); lines.setAttribute('height', extraHeight);
 lines.setAttribute('viewBox', `0 ${-draft.periodPx} ${width} ${extraHeight}`);
 path.setAttribute('d', linePath(width, height));
}
function apply() {
 if (!field || !draft || !clock) return;
 field.style.setProperty('--clr-crt-line-period', draft.periodPx);
 field.style.setProperty('--clr-crt-line-opacity', enabled ? draft.opacity : 0);
 path.setAttribute('stroke-width', draft.thicknessPx);
 geometry();
 clock.effect.setKeyframes([{transform: 'translate3d(0px, 0px, 0)'}, {transform: `translate3d(0px, ${draft.periodPx}px, 0)`}]);
 clock.effect.updateTiming({duration: draft.driftSecondsPerPeriod * 1000});
 if (motion && enabled && field.dataset.motion === 'running') clock.play(); else clock.pause();
 for (const key of keys) {
  byId(key).value = draft[key];
  byId(key + '-value').textContent = key === 'opacity' ? `${Math.round(draft[key] * 100)}%` : `${Number(draft[key].toFixed(2))} ${key === 'driftSecondsPerPeriod' ? 's' : 'px'}`;
 }
 byId('enabled').checked = enabled; byId('motion').checked = motion;
 history.replaceState(null, '', '#' + new URLSearchParams({...draft, lines: enabled ? '1' : '0', motion: motion ? '1' : '0'}));
 byId('status').textContent = 'Scanlines only. Echo uses your latest settings; grain and vignette stay unchanged.' + (motion && field.dataset.motion !== 'running' ? ' Motion is paused by the app or reduced-motion preference.' : '');
}
function connect() {
 const doc = frame.contentDocument;
 const filter = doc?.getElementById('clr-phosphor-echo');
 if (filter) {
  filter.querySelector('feGaussianBlur').setAttribute('stdDeviation', echo.blur);
  filter.querySelector('feOffset').setAttribute('dx', echo.x); filter.querySelector('feOffset').setAttribute('dy', echo.y);
  filter.querySelector('feFuncA').setAttribute('slope', echo.opacity);
 }
 const next = doc?.querySelector('.clr-crt-field:not(.clr-crt-field--contained)');
 const nextClock = next?.getAnimations({subtree: true}).find(animation => animation.id === 'clr-crt-line-drift');
 if (!next || !nextClock || (next === field && clock === nextClock)) return;
 field = next; clock = nextClock; lines = field.querySelector('.clr-crt-field__lines'); path = lines.querySelector('path');
 const style = frame.contentWindow.getComputedStyle(field);
 const firstLine = path.getAttribute('d').match(/^M0 ([-\d.]+)Q[-\d.]+ ([-\d.]+)/);
 baseline ??= {opacity: Number(style.getPropertyValue('--clr-crt-line-opacity')), periodPx: Number(style.getPropertyValue('--clr-crt-line-period')), thicknessPx: Number(path.getAttribute('stroke-width')), curvaturePx: firstLine ? Math.abs((Number(firstLine[1]) - Number(firstLine[2])) / 2) : 6, driftSecondsPerPeriod: Number(clock.effect.getTiming().duration) / 1000};
 if (!draft) {
  draft = {...baseline};
  for (const key of keys) {
   const input = byId(key), value = Number(params.get(key));
   if (params.has(key) && Number.isFinite(value) && value >= Number(input.min) && value <= Number(input.max)) draft[key] = value;
  }
 }
 resizeObserver?.disconnect(); resizeObserver = new ResizeObserver(geometry); resizeObserver.observe(field);
 apply();
}
frame.addEventListener('load', () => {
 observer?.disconnect(); resizeObserver?.disconnect(); field = null; clock = null;
 try {
  observer = new MutationObserver(records => {
   connect();
   if (records.some(record => record.type === 'attributes')) apply();
  });
  observer.observe(frame.contentDocument, {childList: true, subtree: true, attributes: true, attributeFilter: ['data-motion']});
  connect();
 } catch { byId('status').textContent = 'Sign in to the preview normally, then reopen these controls.'; }
});
for (const key of keys) byId(key).addEventListener('input', () => {if (draft) {draft = {...draft, [key]: Number(byId(key).value)}; apply();}});
byId('enabled').addEventListener('change', event => {enabled = event.target.checked; apply();});
byId('motion').addEventListener('change', event => {motion = event.target.checked; apply();});
byId('reset').addEventListener('click', () => {if (baseline) {draft = {...baseline}; enabled = true; motion = true; apply();}});
byId('hide').addEventListener('click', () => {byId('panel').hidden = true; byId('show').hidden = false; byId('show').focus();});
byId('show').addEventListener('click', () => {byId('panel').hidden = false; byId('show').hidden = true; byId('hide').focus();});
byId('copy').addEventListener('click', async () => {
 if (!draft) return;
 const text = JSON.stringify({effect: 'CRT scanlines', enabled, motion, ...draft, echo, grain: 'unchanged', vignette: 'unchanged'}, null, 2) + '\n\n' + location.href;
 try {await navigator.clipboard.writeText(text); byId('status').textContent = 'Copied. Paste the settings into our chat.';}
 catch {byId('status').textContent = 'Copy this page’s link, or send a screenshot of these values.';}
});
if (frame.contentDocument?.readyState === 'complete') frame.dispatchEvent(new Event('load'));
</script>
</body>
</html>
