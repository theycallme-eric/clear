# Supabase CLI configuration (DATA-01a).
#
# `project_id` distinguishes local containers on this host; it is NOT the remote
# project ref. The reused live project (`docs/backend/dispositions.md` §9) is
# reached by `supabase link --project-ref …` or `--db-url`, both of which keep
# their values outside Git. No secret belongs in this file.
#
# Authoring and dry runs only until the off-machine-backup checkbox in
# `docs/backend/live-inventory.md` is checked. `supabase db push` without
# `--dry-run` is TASK-072's job, not this one's.
project_id = "clear"

[db]
# The live project reports PostgreSQL 17.6
# (`docs/backend/capture/inventory-2026-09-18T162244Z.txt`), so a local shadow
# database validates against the same major version the migration will meet.
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
# DATA-02. The three files are generated by `npm run seed` from the committed
# capture and are ordered by foreign key: definitions, then the two tables that
# reference them. Each one asserts its own count and raises if it is wrong.
#
# `supabase/seed/090_dev_baseline.sql` is deliberately absent. It is written
# only by `npm run seed -- --dev`, targets a development database, and needs an
# owner id the operator supplies at apply time — none of which belongs in an
# automatic reset.
enabled = true
sql_paths = [
  "seed/010_exercise_definitions.sql",
  "seed/020_exercise_muscle_groups.sql",
  "seed/030_exercise_pattern_weights.sql",
]

[functions.generate-workout]
# GEN-01. JWT verification is the function's own, not the gateway's, and that is
# deliberate: with `verify_jwt = true` an unauthenticated call is refused by the
# platform with an untyped body and no request id in it, which is precisely the
# 401 this requirement exists to replace. The envelope verifies the same token
# against GoTrue and answers `{ code, message, requestId }` like every other
# failure — so the function is never reachable unauthenticated, it just refuses
# in CLEAR's own words.
verify_jwt = false
# The function imports CORE-03's schemas from `src/`, which import `zod` by bare
# specifier. `functions/deno.json` is where that name resolves.
import_map = "./functions/deno.json"
