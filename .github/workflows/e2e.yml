name: E2E

# ENV-07: the suite runs against the pull request's *preview deployment*, not a
# server this job started. Testing a deploy is what makes a green run mean "the
# thing a reviewer can open works"; testing a local build would only mean "the
# code compiles", which `Build` already says.
#
# `deployment_status` is how that is expressed without a third-party action or
# a polling loop: Vercel's Git integration publishes one when a deployment
# finishes, and it carries the URL. That preview lane receives no privileged
# credential.
#
# The `push` lane keeps the full trusted run, including the OTP flow, from
# reviewed code on `main`.
on:
  deployment_status:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deployment_url:
        description: Production deployment URL to verify
        required: true
        type: string
      deployed_sha:
        description: Exact deployed commit SHA (must equal main)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event_name }}-${{ github.ref || github.event.deployment_status.environment_url }}
  cancel-in-progress: true

jobs:
  preview-e2e:
    # This is a protected status-check identifier. Keep the legacy name stable
    # even though the job now also exercises the touch-tablet project.
    name: Preview E2E (mobile + desktop)
    # Only a successful preview. This job runs pull-request code, so it must
    # never receive the service-role key or mutate the shared test namespace.
    if: >-
      github.event_name == 'deployment_status' &&
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Preview'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.deployment.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Chromium only; the phone, tablet and desktop projects all use it.
      - run: npx playwright install --with-deps chromium

      - name: Run the suite against the preview deployment
        env:
          E2E_BASE_URL: ${{ github.event.deployment_status.environment_url }}
          # Dedicated and revocable. This opens only protected Clear previews;
          # it is not a Vercel account token and grants no Supabase access.
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vibe-audit-${{ github.event.deployment.sha }}
          path: test-results/**/vibe-*.png
          if-no-files-found: ignore
          retention-days: 14

      # The requirement's second artefact requirement: a failure leaves a trace
      # and a screenshot, downloadable from the run, not a stack in a log.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  backend-e2e:
    name: Trusted backend E2E (OTP + RLS + D6)
    # The service-role key is available only to code already reviewed and
    # merged to main. Pull-request/deployment code never enters this job.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Reset the deterministic E2E namespace
        run: npm run e2e:reset

      # The D6 regression joins these checks because it needs what they need: a
      # real project, a real session, and a token that is somebody's. Its
      # schema half runs in every other lane; this is the half that proves it
      # by doing (SES-01b). The Settings to appearance journey (REQ-010) needs
      # a seeded, signed-in user, which only this job can mint.
      - name: Prove OTP, RLS and D6 on the reused project
        run: >-
          npx playwright test e2e/auth-otp.spec.ts e2e/rls.spec.ts
          e2e/d6-swap-persistence.spec.ts
          e2e/settings-appearance.spec.ts
          --project=mobile

      - name: Leave the deterministic E2E namespace clean
        if: always()
        run: npm run e2e:reset

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-backend-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deployed-journeys:
    name: Deployed exact-head no-model journeys (mobile)
    # REQ-010: the core journeys walked in a browser against the deployment of
    # the merged head itself. Only a successful Production deployment — which
    # Vercel builds from reviewed `main` — so the service-role key never meets
    # pull-request code, and the spec checked out is the deployed commit's own.
    if: >-
      github.event_name == 'deployment_status' &&
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_BASE_URL: ${{ github.event.deployment_status.environment_url }}
      E2E_NAMESPACE: deploy-${{ github.event.deployment.sha }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # The harness requires it for any external target in CI; it opens only
      # protected Clear deployments and grants no Supabase access.
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.deployment.sha }}

      - name: Verify the deployment is main's exact head
        env:
          DEPLOYED_SHA: ${{ github.event.deployment.sha }}
        run: |
          git fetch --no-tags --depth=1 origin main
          MAIN_SHA="$(git rev-parse FETCH_HEAD)"
          if [ "$MAIN_SHA" != "$DEPLOYED_SHA" ]; then
            echo "::error::Deployed $DEPLOYED_SHA is not main's head $MAIN_SHA"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # Each spec creates and deletes its own users; the sweep clears what a
      # cancelled run left behind.
      - name: Sweep abandoned E2E namespaces
        run: npm run e2e:reset -- --stale

      - name: Walk History list to session detail on the deployed head
        run: npx playwright test e2e/history-detail.spec.ts --project=mobile

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployed-vibe-audit-${{ github.event.deployment.sha }}
          path: test-results/**/vibe-*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Walk location management against the deployed head
        run: npx playwright test e2e/settings-locations.spec.ts --project=mobile

      - name: Walk appearance persistence against the deployed head
        run: npx playwright test e2e/settings-appearance.spec.ts --project=mobile

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-deployed-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  live-model-canary:
    name: Paid release canary (one generation)
    # A model call is a release decision, not routine CI. This job exists only
    # when a person or release operator explicitly dispatches it with the
    # production URL and exact deployed SHA.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: clear-paid-model-canary
      cancel-in-progress: false
    env:
      E2E_BASE_URL: ${{ inputs.deployment_url }}
      E2E_NAMESPACE: canary-${{ inputs.deployed_sha }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      LIVE_MODEL_TESTS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.deployed_sha }}

      - name: Verify the requested deployment is main's exact head
        env:
          DEPLOYED_SHA: ${{ inputs.deployed_sha }}
        run: |
          git fetch --no-tags --depth=1 origin main
          MAIN_SHA="$(git rev-parse FETCH_HEAD)"
          if [ "$MAIN_SHA" != "$DEPLOYED_SHA" ]; then
            echo "::error::Requested $DEPLOYED_SHA is not main's head $MAIN_SHA"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Declare the paid-call budget
        run: |
          echo "### Paid model canary" >> "$GITHUB_STEP_SUMMARY"
          echo "Paid workout generations: exactly 1." >> "$GITHUB_STEP_SUMMARY"
          echo "Provider attempts: 1 normally; 2 maximum only for a retryable failure." >> "$GITHUB_STEP_SUMMARY"
          echo "Playwright retries: 0. Concurrent canaries: 1." >> "$GITHUB_STEP_SUMMARY"

      - name: Walk the release core loop with one real generation
        run: npx playwright test e2e/core-loop.spec.ts --project=mobile --retries=0

      - name: Sweep the canary namespace
        if: always()
        run: npm run e2e:reset -- --stale

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paid-canary-${{ inputs.deployed_sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
