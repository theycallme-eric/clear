name: E2E

# ENV-07: the suite runs against the pull request's *preview deployment*, not a
# server this job started. Testing a deploy is what makes a green run mean "the
# thing a reviewer can open works"; testing a local build would only mean "the
# code compiles", which `Build` already says.
#
# `deployment_status` is how that is expressed without a third-party action or
# a polling loop: Vercel's Git integration publishes one when a deployment
# finishes, and it carries the URL. That preview lane receives no privileged
# credential.
#
# The `pull_request` lane is the standing row-level-security check (REQ-007):
# cross-user read and write denial on every user-owned table, re-proved before
# a change can merge rather than after. It needs a real database, so it needs
# the service-role key, and that is a deliberate trade written down here:
#
#   * it runs only for a branch in this repository. A pull request from a fork
#     receives no secret from GitHub at all, so the job would fail confusingly
#     rather than protect anything — the `if` skips it instead, and the
#     schema-disposition half of the suite still runs on a fork through `CI`;
#   * it runs one spec file, `rls.spec.ts`, and starts no browser against
#     untrusted origins;
#   * it works in a namespace of its own, derived from the pull request number,
#     so two pull requests testing at once cannot delete each other's users;
#   * it resets before, resets after — even on failure — and sweeps namespaces
#     abandoned by cancelled runs.
#
# The `push` lane keeps the full trusted run, including the OTP flow, from
# reviewed code on `main`.
on:
  deployment_status:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref || github.event.deployment_status.environment_url }}
  cancel-in-progress: true

jobs:
  rls-standing:
    name: Standing RLS matrix (mobile)
    # Two conditions, and the second one is a dependency, not a preference.
    #
    #   * Branches in this repository only — see the header. A fork gets no
    #     secret from GitHub, so there is nothing for this job to run with.
    #   * `E2E_LIVE_SCHEMA_READY` is the repository variable TASK-072 sets when
    #     it applies the rebuild's migrations to the reused project. Until
    #     then the live schema is the previous application's, the fixtures
    #     cannot be seeded into it, and this job would report a schema gap as
    #     an RLS failure on every pull request. Unset means skipped, which is
    #     the safe default; set it to `true` in the same change that pushes
    #     the migrations, and the standing check starts gating merges with no
    #     edit to this file.
    #
    # The credential-free half of the requirement does not wait for either:
    # the disposition audit runs in `CI` and again inside this suite, on every
    # pull request from anywhere.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.E2E_LIVE_SCHEMA_READY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Its own users and its own primary keys, derived from this number. Two
      # pull requests can be tested at the same moment without either one's
      # seed deleting the other's users mid-run.
      E2E_NAMESPACE: pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # `--stale` also removes harness users abandoned by namespaces that will
      # never run again — a cancelled job's pull request number does not come
      # round twice, so nothing else knows their addresses.
      - name: Start from a clean namespace, and clear abandoned ones
        run: npm run e2e:reset -- --stale

      - name: Prove cross-user read and write denial on every user table
        run: npx playwright test e2e/rls.spec.ts --project=mobile

      - name: Leave no persistent test data behind
        if: always()
        run: npm run e2e:reset

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-rls-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  preview-e2e:
    name: Preview E2E (mobile + desktop)
    # Only a successful preview. This job runs pull-request code, so it must
    # never receive the service-role key or mutate the shared test namespace.
    if: >-
      github.event_name == 'deployment_status' &&
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Preview'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.deployment.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Browsers only, and only the ones the two projects use.
      - run: npx playwright install --with-deps chromium

      - name: Run the suite against the preview deployment
        env:
          E2E_BASE_URL: ${{ github.event.deployment_status.environment_url }}
          # Dedicated and revocable. This opens only protected Clear previews;
          # it is not a Vercel account token and grants no Supabase access.
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run e2e

      # The requirement's second artefact requirement: a failure leaves a trace
      # and a screenshot, downloadable from the run, not a stack in a log.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  backend-e2e:
    name: Trusted backend E2E (OTP + RLS)
    # The service-role key is available only to code already reviewed and
    # merged to main. Pull-request/deployment code never enters this job.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Reset the deterministic E2E namespace
        run: npm run e2e:reset

      - name: Prove OTP and row-level security against the reused test project
        run: >-
          npx playwright test e2e/auth-otp.spec.ts e2e/rls.spec.ts
          --project=mobile

      - name: Leave the deterministic E2E namespace clean
        if: always()
        run: npm run e2e:reset

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-backend-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
