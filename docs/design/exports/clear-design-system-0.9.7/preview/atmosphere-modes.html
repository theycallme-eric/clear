<!DOCTYPE html>
<!-- @dsCard group="Foundation" name="Atmosphere Modes" subtitle="Full on every screen · Quiet and Operational defined, unused by default" viewport="700x300" --><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0;padding:0;background:var(--bg);overflow:hidden}
a{color:var(--interaction-300)}a:hover{color:var(--interaction-100)}
.card{box-sizing:border-box;height:300px;padding:18px 22px;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.col{display:flex;flex-direction:column;gap:6px;min-width:0}
.scr{position:relative;overflow:hidden;flex:1;border:var(--border-width) solid var(--border-frame-structure);display:flex;flex-direction:column;justify-content:flex-end;padding:14px;gap:6px}
.scr>.clr-atmosphere{z-index:0}.scr>:not(.clr-atmosphere){position:relative;z-index:1}
.lb{font-family:var(--font-data);font-size:var(--label-xs-size);font-weight:700;letter-spacing:var(--tracking-data);text-transform:uppercase;color:var(--text-card-label)}
.h{font-family:var(--font-display);font-size:20px;font-weight:700;text-transform:uppercase;color:var(--text-header)}
.p{font-family:var(--font-body);font-size:12px;line-height:1.35;color:var(--text-secondary)}
.fr{padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.small{flex:1;position:relative;overflow:hidden;border:var(--border-width) solid var(--border-frame-structure);padding:10px;display:flex;flex-direction:column;justify-content:flex-end}
.small>.clr-atmosphere{z-index:0}.small>:not(.clr-atmosphere){position:relative;z-index:1}
</style></head><body><div class="card">
<div class="col"><span class="lb">Full · 40% · the default, every screen</span>
 <div class="scr" data-atmosphere="full" data-at="1"><span class="clr-bleed clr-bleed--block"><span class="clr-chamfer clr-chamfer--md fr"><span class="lb">Session 09</span><span class="h">Lower push</span></span></span><span class="p">Frames keep a solid ground, so text contrast never depends on the atmosphere.</span></div></div>
<div class="col"><span class="lb">Defined, not used by default</span>
 <div class="small" data-atmosphere="quiet" data-at="1"><span class="lb">Quiet · 10%</span></div>
 <div class="small" data-atmosphere="operational" data-at="1"><span class="lb">Operational · 6%</span></div></div>
</div>
<script>
const ATM='<div class="clr-atmosphere"><span class="clr-atmosphere__blob clr-atmosphere__blob--structure"></span><span class="clr-atmosphere__blob clr-atmosphere__blob--interaction"></span><span class="clr-atmosphere__blob clr-atmosphere__blob--info"></span><span class="clr-atmosphere__overlay"></span><span class="clr-atmosphere__scan"></span></div>';
document.querySelectorAll('[data-at]').forEach(s=>s.insertAdjacentHTML('afterbegin',ATM));
</script></body></html>
