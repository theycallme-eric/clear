<!DOCTYPE html>
<html data-skin="clear"><head><meta charset="utf-8"><title>Atmosphere strength</title>
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0;background:var(--bg);color:var(--text-paragraph);font-family:var(--font-body)}
a{color:var(--interaction-400)}a:hover{color:var(--interaction-300)}
.pg{padding:24px;display:flex;flex-direction:column;gap:18px;max-width:1240px}
.ttl{font-family:var(--font-display);font-size:20px;font-weight:700;text-transform:uppercase;color:var(--text-header)}
.sub{font-size:13px;line-height:1.5;max-width:880px;color:color-mix(in srgb,var(--text-paragraph) 82%,transparent)}
.bar{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.bar .l{font-family:var(--font-data);font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-card-label)}
.seg{display:flex;gap:6px}
.pill{font-family:var(--font-data);font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:6px 10px;min-height:32px;background:transparent;color:var(--text-tab-inactive);border:var(--border-width) solid var(--structure-a300);cursor:pointer}
.pill[aria-pressed="true"]{background:var(--surface-frame-interaction);color:var(--text-tab-active);border-color:var(--interaction-500)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:16px}
.opt{display:flex;flex-direction:column;gap:10px;min-width:0}
.badge{display:flex;gap:8px;align-items:baseline}
.badge b{font-family:var(--font-data);font-size:11px;font-weight:700;letter-spacing:.05em;padding:2px 6px;border:var(--border-width) solid var(--structure-500);color:var(--text-header)}
.badge span{font-family:var(--font-data);font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-header)}
.desc{font-size:12px;line-height:1.5;color:color-mix(in srgb,var(--text-paragraph) 82%,transparent)}
.flag{font-family:var(--font-data);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--selection-400)}
.scr{position:relative;height:520px;overflow:hidden;border:var(--border-width) solid rgb(from var(--structure) r g b / .9)}
.cont{position:relative;z-index:1;padding:18px 16px;display:flex;flex-direction:column;gap:16px}
.h{font-family:var(--font-display);font-size:24px;font-weight:700;line-height:1.1;text-transform:uppercase;color:var(--text-header)}
.grp{display:flex;flex-direction:column;gap:6px}
.gl{font-family:var(--font-data);font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-card-label)}
.card{--brd:rgb(from var(--structure) r g b / .9);padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;line-height:1.25;color:var(--text-paragraph)}
.card::before{background-image:repeating-linear-gradient(to bottom,rgb(0 0 0 / .18) 0 1px,transparent 1px 3px)}
.card span{font-family:var(--font-data);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:color-mix(in srgb,var(--text-paragraph) 70%,transparent)}
/* One thing changes: blob strength in the Full atmosphere. */
.a30{--atmosphere-opacity:.30}
.a40{--atmosphere-opacity:.40}
.a60{--atmosphere-opacity:.60}
</style></head><body><div class="pg">
<div class="ttl">Atmosphere strength</div>
<div class="sub">Frames keep their solid ground (your pick A). This changes only how strong the coloured blobs in the background are, on a screen laid out like your reference: labelled groups, wide frames, room around them. Everything else is identical.</div>
<div class="bar"><span class="l">Skin</span><span class="seg" id="skins"></span></div>
<div class="grid" id="grid"></div>
</div>
<script>
const OPTS=[['A','Current · 30%','a30','What ships today.',''],['B','40%','a40','Blobs are clearly there without competing with content.','Recommended: closest to your reference'],['C','60%','a60','Strong colour fields; the screen reads as lit from behind.','']];
const grid=document.getElementById('grid');
const g=(l,rows)=>`<div class="grp"><div class="gl">${l}</div>${rows.map(r=>`<div class="clr-chamfer clr-chamfer--sm card">${r[0]}<span>${r[1]}</span></div>`).join('')}</div>`;
OPTS.forEach(([id,name,cls,desc,flag])=>{const o=document.createElement('div');o.className='opt';
 o.innerHTML=`<div class="badge"><b>${id}</b><span>${name}</span></div>
 <div class="scr ${cls}" data-atmosphere="full"><div class="clr-atmosphere"><span class="clr-atmosphere__blob clr-atmosphere__blob--structure"></span><span class="clr-atmosphere__blob clr-atmosphere__blob--interaction"></span><span class="clr-atmosphere__blob clr-atmosphere__blob--info"></span><span class="clr-atmosphere__blob clr-atmosphere__blob--selection"></span><span class="clr-atmosphere__overlay"></span><span class="clr-atmosphere__scan"></span></div>
 <div class="cont"><div class="h">Today</div>
 ${g('Session',[['Back squat','5 × 5'],['Romanian deadlift','3 × 8']])}
 ${g('Accessories',[['Split squat','3 × 10'],['Calf raise','4 × 12']])}
 ${g('Notes',[['Keep the bar path over mid-foot','Coach']])}</div></div>
 <div class="desc">${desc}</div>${flag?`<div class="flag">${flag}</div>`:''}`;grid.appendChild(o)});
const host=document.getElementById('skins');
['clear','vapour','signal','mono'].forEach((s,i)=>{const b=document.createElement('button');b.className='pill';b.type='button';b.textContent=s;b.setAttribute('aria-pressed',i===0);
 b.onclick=()=>{[...host.children].forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');document.documentElement.setAttribute('data-skin',s)};host.appendChild(b)});
</script>
</body></html>
