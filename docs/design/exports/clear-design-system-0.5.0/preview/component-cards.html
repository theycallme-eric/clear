<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);overflow:hidden}
  .card{padding:18px 22px;box-sizing:border-box;color:var(--fg);display:flex;gap:14px;align-items:stretch}
  .demo{flex:1;display:flex;gap:0;min-width:0}
  .col{width:8px;background:linear-gradient(var(--color-orange-alpha-400),var(--color-orange-alpha-400)),var(--color-neutral-900);border:2px solid var(--color-orange-500);border-right:none;animation:pulse-micro 4s steps(2,end) infinite}
  .body-outer{flex:1;background:var(--color-orange-500);clip-path:polygon(0 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%);padding:2px 2px 2px 0}
  .body{height:100%;box-sizing:border-box;padding:10px 14px;background:linear-gradient(var(--color-orange-alpha-100),var(--color-orange-alpha-100)),var(--color-neutral-900);clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%)}
  .body .h{font-family:var(--font-headings);font-size:16px;font-weight:700;text-transform:uppercase;color:var(--color-blue-300);margin-bottom:4px}
  .body .p{font-family:var(--font-paragraph);font-size:11px;color:rgba(255,255,255,0.75);line-height:1.3}
  .body .meta{font-family:var(--font-label);font-size:9px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-orange-300);margin-top:4px}
  @keyframes pulse-micro{0%,100%{opacity:1}50%{opacity:0.85}}
</style>
</head><body><div class="card">
  <div class="demo">
    <div class="col"></div>
    <div class="body-outer"><div class="body">
      <div class="h">UPPER BODY · PUSH</div>
      <div class="p">Bench, overhead press, dips. 4 movements, 45 min.</div>
      <div class="meta">INT. 7 · TODAY</div>
    </div></div>
  </div>
  <div class="demo">
    <div class="col"></div>
    <div class="body-outer"><div class="body">
      <div class="h">LEGS · STRENGTH</div>
      <div class="p">Squats, RDL, lunges. 5 movements, 60 min.</div>
      <div class="meta">INT. 8 · TOMORROW</div>
    </div></div>
  </div>
</div></body></html>
