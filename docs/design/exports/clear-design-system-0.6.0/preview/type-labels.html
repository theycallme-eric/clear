<!DOCTYPE html>
<!-- @dsCard group="Type" name="Type — Labels & Timers" subtitle="Oxanium · CTAs, chips, timers" viewport="700x180" --><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);overflow:hidden}
  .card{padding:16px 22px;box-sizing:border-box;color:var(--fg)}
  .row{display:flex;align-items:baseline;gap:20px;margin-bottom:12px}
  .spec{font-family:var(--font-label);font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:#fff}
  .meta{font-family:var(--font-label);font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-blue-300);white-space:nowrap}
  .chip{display:inline-flex;align-items:center;padding:4px 10px;background:var(--color-orange-alpha-200);border:1px solid var(--color-orange-500);color:var(--color-orange-100);font-family:var(--font-label);font-weight:700;text-transform:uppercase}
  .timer{font-family:var(--font-label);font-weight:700;font-variant-numeric:tabular-nums;color:var(--color-green-400);text-shadow:0 0 10px var(--color-green-alpha-400)}
</style>
</head><body><div class="card">
<div class="row"><div class="spec" style="font-size:24px">INITIATE WORKOUT</div><div class="meta">OXANIUM · L-XL 24/28</div></div>
<div class="row"><div class="spec" style="font-size:16px">MARK REST DAY</div><div class="meta">OXANIUM · L-MD 16/20</div></div>
<div class="row"><span class="chip" style="font-size:12px">INT. 7</span><div class="timer" style="font-size:28px">02:45</div><div class="meta">LABEL · TIMER DISPLAYS</div></div>
</div></body></html>
