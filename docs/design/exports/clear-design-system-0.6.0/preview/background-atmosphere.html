<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Brand — Background Atmosphere" subtitle="5-layer stack · blob colours follow the skin" viewport="700x200" --><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0;padding:0;background:#171717;overflow:hidden}
  :root{--atmosphere-blur:48px;--atmosphere-opacity:.34;--atmosphere-dim:.45}
  .card{height:100%;position:relative;padding:16px 22px;box-sizing:border-box;color:var(--fg)}
  .content{position:relative;z-index:3}
  h3{font-family:var(--font-headings);font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:0.02em;color:var(--text-header);margin:0 0 4px;text-shadow:0 0 12px rgba(0,0,0,0.5)}
  p{font-family:var(--font-paragraph);font-size:12px;color:rgba(255,255,255,0.75);margin:0;line-height:1.4;max-width:380px}
</style>
</head><body><div class="card">
  <div class="clr-atmosphere">
    <span class="clr-atmosphere__blob clr-atmosphere__blob--structure"></span>
    <span class="clr-atmosphere__blob clr-atmosphere__blob--interaction"></span>
    <span class="clr-atmosphere__blob clr-atmosphere__blob--info"></span>
    <span class="clr-atmosphere__overlay"></span>
    <span class="clr-atmosphere__scan"></span>
  </div>
  <div class="content">
    <h3>ATMOSPHERE · 5 LAYERS</h3>
    <p>Dark base + drifting structure/interaction/info blobs + dark overlay + grain + scanlines. The canvas everything sits on, and it follows the skin — change the roles and the weather changes with them.</p>
  </div>
</div></body></html>
