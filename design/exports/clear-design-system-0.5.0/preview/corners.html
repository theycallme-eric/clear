<!DOCTYPE html>
<!-- @dsCard group="Shape" name="Radius & Chamfer" subtitle="Radius 0 is the default · the cut is the signature" viewport="700x160" --><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);overflow:hidden}
  .card{padding:16px 22px;box-sizing:border-box;color:var(--fg);display:flex;gap:16px;align-items:stretch}
  .cell{flex:1;min-width:0;padding:14px;background:linear-gradient(var(--color-orange-alpha-100),var(--color-orange-alpha-100)),var(--color-neutral-900);border:2px solid var(--color-orange-500)}
  .chamfer-outer{flex:1;min-width:0;background:var(--color-orange-500);clip-path:polygon(0 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%);padding:2px}
  .chamfer-inner{height:100%;box-sizing:border-box;padding:12px;background:linear-gradient(var(--color-orange-alpha-100),var(--color-orange-alpha-100)),var(--color-neutral-900);clip-path:polygon(0 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%)}
  .lbl{font-family:var(--font-label);font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-orange-300);margin-bottom:6px}
  .h{font-family:var(--font-headings);font-size:20px;font-weight:700;text-transform:uppercase;color:var(--color-blue-100);margin-bottom:4px}
  .p{font-family:var(--font-paragraph);font-size:12px;color:rgba(255,255,255,0.65);line-height:1.35}
</style>
</head><body><div class="card">
  <div class="cell">
    <div class="lbl">RADIUS · 0PX</div>
    <div class="h">SHARP</div>
    <div class="p">Default. Every container, button, input.</div>
  </div>
  <div class="chamfer-outer">
    <div class="chamfer-inner">
      <div class="lbl">CHAMFER · 16PX</div>
      <div class="h">SIGNATURE</div>
      <div class="p">Bottom-right cut. Border follows the diagonal.</div>
    </div>
  </div>
</div></body></html>
