<!DOCTYPE html>
<!-- @dsCard group="Type" name="Type — Display Scale" subtitle="Rajdhani · screen titles and card headings · uppercase" viewport="700x200" --><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0;padding:0;background:var(--bg);overflow:hidden}
a{color:var(--interaction-300)}a:hover{color:var(--interaction-100)}
.card{padding:16px 22px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:baseline;gap:20px}
.s{font-family:var(--font-display);font-weight:700;text-transform:uppercase;letter-spacing:var(--tracking-display);color:var(--text-header);line-height:1}
.m{font-family:var(--font-data);font-size:var(--label-xs-size);font-weight:700;letter-spacing:var(--tracking-data);text-transform:uppercase;color:var(--text-card-label);white-space:nowrap}
</style></head><body><div class="card">
<div class="row"><div class="s" style="font-size:var(--heading-h1-size)">Today</div><div class="m">Screen title · H1 · 32/40</div></div>
<div class="row"><div class="s" style="font-size:var(--heading-h2-size)">Generate workout</div><div class="m">Section · H2 · 28/32</div></div>
<div class="row"><div class="s" style="font-size:var(--heading-h5-size)">No workout scheduled</div><div class="m">Card heading · 20/24</div></div>
</div></body></html>
