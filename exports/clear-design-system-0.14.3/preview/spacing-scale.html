<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Spacing — Scale" subtitle="4px base · 100/200/300…" viewport="700x140" --><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);overflow:hidden}
  .card{padding:16px 22px;box-sizing:border-box;color:var(--fg);display:flex;gap:20px;align-items:center;flex-wrap:wrap}
  .group{display:flex;flex-direction:column;align-items:center;gap:8px}
  .bar{background:var(--structure-500);height:20px}
  .label{font-family:var(--font-data);font-size:12px;font-weight:700;letter-spacing:var(--tracking-data);text-transform:uppercase;color:var(--text-card-label)}
  .value{font-family:var(--font-data);font-size:12px;color:var(--text-secondary)}
</style>
</head><body><div class="card">
  <div class="group"><div class="bar" style="width:4px"></div><div class="label">100</div><div class="value">4px</div></div>
  <div class="group"><div class="bar" style="width:8px"></div><div class="label">200</div><div class="value">8px</div></div>
  <div class="group"><div class="bar" style="width:12px"></div><div class="label">300</div><div class="value">12px</div></div>
  <div class="group"><div class="bar" style="width:16px"></div><div class="label">400</div><div class="value">16px</div></div>
  <div class="group"><div class="bar" style="width:20px"></div><div class="label">500</div><div class="value">20px</div></div>
  <div class="group"><div class="bar" style="width:24px"></div><div class="label">600</div><div class="value">24px</div></div>
  <div class="group"><div class="bar" style="width:32px"></div><div class="label">700</div><div class="value">32px</div></div>
  <div class="group"><div class="bar" style="width:40px"></div><div class="label">800</div><div class="value">40px</div></div>
  <div class="group"><div class="bar" style="width:48px"></div><div class="label">1000</div><div class="value">48px</div></div>
  <div class="group"><div class="bar" style="width:64px"></div><div class="label">1200</div><div class="value">64px</div></div>
</div></body></html>
