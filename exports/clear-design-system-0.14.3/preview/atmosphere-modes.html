<!DOCTYPE html>
<!-- @dsCard group="Foundation" name="Atmosphere" subtitle="One intensity, every screen · frames keep a solid ground" viewport="700x260" --><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0;padding:0;background:var(--bg);overflow:hidden}
a{color:var(--interaction-300)}a:hover{color:var(--interaction-100)}
.card{box-sizing:border-box;height:260px;padding:18px 22px}
.scr{position:relative;overflow:hidden;height:100%;box-sizing:border-box;border:var(--border-width) solid var(--border-frame-structure);display:flex;flex-direction:column;justify-content:flex-end;padding:14px;gap:8px}
.scr>.clr-atmosphere{z-index:0}.scr>:not(.clr-atmosphere){position:relative;z-index:1}
.lb{font-family:var(--font-data);font-size:var(--label-xs-size);font-weight:700;letter-spacing:var(--tracking-data);text-transform:uppercase;color:var(--text-card-label)}
.h{font-family:var(--font-display);font-size:20px;font-weight:700;text-transform:uppercase;color:var(--text-header)}
.p{font-family:var(--font-body);font-size:12px;line-height:1.25;color:var(--text-secondary)}
.fr{padding:10px 12px;display:flex;flex-direction:column;gap:2px;max-width:280px}
</style></head><body><div class="card"><div class="scr">
<div class="clr-atmosphere"><span class="clr-atmosphere__blob clr-atmosphere__blob--structure"></span><span class="clr-atmosphere__blob clr-atmosphere__blob--interaction"></span><span class="clr-atmosphere__blob clr-atmosphere__blob--info"></span><span class="clr-atmosphere__overlay"></span><span class="clr-atmosphere__scan"></span></div>
<span class="clr-bleed clr-bleed--block" style="max-width:280px"><span class="clr-card"><span class="clr-card__bar"></span><span class="clr-chamfer clr-chamfer--md clr-card__body fr"><span class="lb">Session 09</span><span class="h">Lower push</span></span></span></span>
<span class="p">Blobs at 40%. The same on every screen; frames keep a solid ground, so text contrast never depends on the atmosphere.</span>
</div></div></body></html>
