<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Spacing — Light, not shadow" subtitle="2px bleed on every border · 6px glow on the primary only · nothing else glows" viewport="700x200" --><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0;padding:0;background:var(--bg);overflow:hidden}
a{color:var(--interaction-300)}a:hover{color:var(--interaction-100)}
.card{box-sizing:border-box;height:200px;padding:18px 22px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.cell{display:flex;flex-direction:column;gap:10px;min-width:0}
.demo{height:64px;display:flex;align-items:center}
.box{padding:10px 14px;font-family:var(--font-data);font-size:var(--label-sm-size);font-weight:700;letter-spacing:var(--tracking-data);text-transform:uppercase;color:var(--text-header)}
.lb{font-family:var(--font-data);font-size:var(--label-xs-size);font-weight:700;letter-spacing:var(--tracking-data);text-transform:uppercase;color:var(--text-card-label)}
.p{font-family:var(--font-body);font-size:12px;line-height:1.25;color:var(--text-secondary)}
.streak{position:relative;width:100%;height:2px;background:var(--structure-500);opacity:.7;box-shadow:0 0 7px var(--structure-500)}
</style></head><body><div class="card">
<div class="cell"><div class="demo"><span class="clr-bleed"><span class="clr-chamfer clr-chamfer--sm box">Back squat</span></span></div><span class="lb">Every border · 2px bleed</span><span class="p">Phosphor on glass, outside and inside the line. <code>.clr-bleed</code></span></div>
<div class="cell"><div class="demo"><span class="clr-bleed clr-glow" style="--bleed:var(--border-cta-primary)"><button class="clr-chamfer clr-chamfer--sm clr-btn clr-btn--primary" type="button" style="min-height:var(--control-height);padding:0 16px">Log set</button></span></div><span class="lb">Primary action · 6px glow</span><span class="p">One per screen. Nothing else glows at rest. <code>.clr-glow</code></span></div>
<div class="cell"><div class="demo"><span class="streak"></span></div><span class="lb">Scroll edge · while scrolling</span><span class="p">Streaks and the scrollbar light up while moving, then settle.</span></div>
</div></body></html>
