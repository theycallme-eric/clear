<!DOCTYPE html>
<!-- @dsCard group="Shape" name="Radius & Chamfer" subtitle="Radius 0 · one cut, bottom right · 8 / 12 / 24px by height" viewport="700x200" --><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0;padding:0;background:var(--bg);overflow:hidden}
a{color:var(--interaction-300)}a:hover{color:var(--interaction-100)}
.card{box-sizing:border-box;height:200px;padding:18px 22px;display:flex;gap:14px;align-items:flex-start}
.f{padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.lb{font-family:var(--font-data);font-size:var(--label-xs-size);font-weight:700;letter-spacing:var(--tracking-data);text-transform:uppercase;color:var(--text-card-label)}
.p{font-family:var(--font-body);font-size:12px;line-height:1.25;color:var(--text-secondary)}
.sq{flex:1;min-width:0;height:72px;padding:10px 12px;box-sizing:border-box;border:var(--border-width) solid var(--border-frame-structure);display:flex;flex-direction:column;gap:4px}
</style></head><body><div class="card">
<div class="sq"><span class="lb">Radius 0</span><span class="p">Nothing is rounded.</span></div>
<div class="clr-bleed clr-bleed--block" style="flex:1;min-width:0"><div class="clr-chamfer clr-chamfer--sm f" style="height:64px;box-sizing:border-box"><span class="lb">8px · under 80px tall</span><span class="p">Chips, buttons, tags.</span></div></div>
<div class="clr-bleed clr-bleed--block" style="flex:1;min-width:0"><div class="clr-chamfer clr-chamfer--md f" style="height:110px;box-sizing:border-box"><span class="lb">12px · up to 140px</span><span class="p">Most cards.</span></div></div>
<div class="clr-bleed clr-bleed--block" style="flex:1;min-width:0"><div class="clr-chamfer clr-chamfer--lg f" style="height:160px;box-sizing:border-box"><span class="lb">24px · above 140px</span><span class="p">Large cards, timers. One cut only, always bottom right.</span></div></div>
</div></body></html>
