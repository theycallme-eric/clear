<!DOCTYPE html>
<!-- @dsCard group="Type" name="Type — Labels & Timers" subtitle="Oxanium · CTAs, chips, timers" viewport="700x180" --><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);overflow:hidden}
  .card{padding:16px 22px;box-sizing:border-box;color:var(--fg)}
  .row{display:flex;align-items:baseline;gap:20px;margin-bottom:12px}
  .spec{font-family:var(--font-data);font-weight:700;text-transform:uppercase;letter-spacing:var(--tracking-data);color:var(--text-header)}
  .meta{font-family:var(--font-data);font-size:12px;font-weight:700;letter-spacing:var(--tracking-data);text-transform:uppercase;color:var(--text-card-label);white-space:nowrap}
  .chip{display:inline-flex;align-items:center;padding:4px 10px;background:var(--surface-unselected);border:var(--border-width) solid var(--border-unselected);color:var(--text-unselected);font-family:var(--font-data);font-weight:700;text-transform:uppercase}
  .timer{font-family:var(--font-data);font-weight:700;font-variant-numeric:tabular-nums;color:var(--text-timer)}
</style>
</head><body><div class="card">
<div class="row"><div class="spec" style="font-size:24px">INITIATE WORKOUT</div><div class="meta">OXANIUM · L-XL 24/28</div></div>
<div class="row"><div class="spec" style="font-size:16px">LOG SET</div><div class="meta">OXANIUM · L-MD 16/20</div></div>
<div class="row"><span class="chip" style="font-size:12px">INT. 7</span><div class="timer" style="font-size:28px">02:45</div><div class="meta">LABEL · TIMER DISPLAYS</div></div>
</div></body></html>
